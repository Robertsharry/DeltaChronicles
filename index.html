<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pokémon: The Delta Cronicles</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { height:100%; }
  body {
    background:
      radial-gradient(ellipse at top, rgba(46, 184, 114, 0.06), transparent 60%),
      #0a0d11;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; min-height:100vh; overflow:hidden;
    font-family:'Press Start 2P', ui-monospace, 'Courier New', monospace;
    color:#e8eef5; gap:10px; padding:8px;
  }

  /* ===== GAME BOY ADVANCE SHELL ===== */
  #gba {
    /* Native ref is 1181x677. Scale to fit viewport. */
    --gba-w: min(98vw, 1280px);
    width: var(--gba-w);
    aspect-ratio: 1181 / 677;
    position: relative;
    background: #1a1a1c;
    border-radius: 16% 16% 22% 22% / 28% 28% 38% 38%;
    box-shadow:
      0 18px 60px rgba(0,0,0,0.65),
      inset 0 -8px 22px rgba(0,0,0,0.55),
      inset 0 4px 14px rgba(255,255,255,0.06);
  }
  /* Shoulder buttons L/R poking out top corners (decorative) */
  #gba::before, #gba::after {
    content: ''; position: absolute; top: 1.2%; width: 6%; height: 14%;
    background: linear-gradient(180deg, #aeb1b6, #6b6e72);
    box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
  }
  #gba::before { left: 0.3%; border-radius: 60% 12% 12% 60% / 60% 20% 20% 60%; }
  #gba::after  { right: 0.3%; border-radius: 12% 60% 60% 12% / 20% 60% 60% 20%; }

  /* Nintendo branding top center */
  .gba-nin {
    position: absolute; top: 2.6%; left: 50%; transform: translateX(-50%);
    background: #404449; color: #d8dbe0;
    padding: 0.3% 1.2%;
    font-size: clamp(7px, 1vw, 11px); letter-spacing: 1px;
    border-radius: 0 0 6px 6px;
    font-family: serif; font-style: italic;
  }
  /* Power LED top right */
  .gba-power {
    position: absolute; top: 16%; right: 12%;
    display: flex; align-items: center; gap: 6px;
  }
  .gba-power .dot {
    width: clamp(6px, 0.7vw, 9px); height: clamp(6px, 0.7vw, 9px);
    background: radial-gradient(circle at 30% 30%, #d4ffb8, #4fc342 60%, #2e7027);
    border-radius: 50%;
    box-shadow: 0 0 4px rgba(80, 240, 100, 0.7);
  }
  .gba-power .lbl {
    color: #aab; font-size: clamp(6px, 0.65vw, 8px); letter-spacing: 1px;
  }

  /* Screen bezel (dark plastic frame around canvas) */
  .gba-screen {
    position: absolute;
    top: 17%; left: 26%; width: 48%; height: 64%;
    background: #202326;
    border-radius: 8px;
    padding: 4%;
    box-shadow: inset 0 0 0 2px #0e1012, inset 0 4px 10px rgba(0,0,0,0.6);
  }
  .gba-screen canvas {
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000;
    border-radius: 2px;
  }

  /* GAME BOY ADVANCE label below screen */
  .gba-label {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    color: #d2d4d8; font-style: italic; font-weight: bold;
    font-size: clamp(8px, 1.2vw, 14px); letter-spacing: 1.5px;
    font-family: 'Arial Black', sans-serif;
    white-space: nowrap;
  }

  /* D-PAD on left */
  .gba-dpad {
    position: absolute; left: 7%; top: 38%;
    width: 14%; aspect-ratio: 1/1;
  }
  .gba-dpad .key {
    position: absolute;
    background: linear-gradient(160deg, #b8bbc1, #6e7176);
    border-radius: 2px;
    color: #2a2c2f; font-size: 0.8vw;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.5);
    transition: transform 0.05s;
  }
  .gba-dpad .key:active { transform: scale(0.93); filter: brightness(0.8); }
  .gba-dpad .up    { top: 0; left: 33%; width: 34%; height: 33%; border-radius: 4px 4px 0 0; }
  .gba-dpad .down  { bottom: 0; left: 33%; width: 34%; height: 33%; border-radius: 0 0 4px 4px; }
  .gba-dpad .left  { left: 0; top: 33%; width: 33%; height: 34%; border-radius: 4px 0 0 4px; }
  .gba-dpad .right { right: 0; top: 33%; width: 33%; height: 34%; border-radius: 0 4px 4px 0; }
  .gba-dpad .center {
    left: 33%; top: 33%; width: 34%; height: 34%;
    background: linear-gradient(160deg, #8e9196, #5e6166);
    pointer-events: none;
  }

  /* A/B buttons on right */
  .gba-ab {
    position: absolute; right: 5%; top: 36%;
    width: 18%; aspect-ratio: 2/1;
    transform: rotate(-22deg);
  }
  .gba-ab .key {
    position: absolute;
    width: 42%; aspect-ratio: 1/1; border-radius: 50%;
    background: linear-gradient(160deg, #c8cbd1, #7e8186);
    color: #2a2c2f; font-weight: bold;
    font-size: clamp(8px, 1.1vw, 14px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: none;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.5);
    transition: transform 0.05s;
  }
  .gba-ab .key:active { transform: scale(0.92); filter: brightness(0.8); }
  .gba-ab .b { left: 0; bottom: 0; }
  .gba-ab .a { right: 0; top: 0; }

  /* START / SELECT below DPad */
  .gba-startsel {
    position: absolute; bottom: 14%; left: 13%;
    display: flex; gap: 6%; align-items: center;
    transform: rotate(-22deg);
  }
  .gba-startsel .key {
    background: linear-gradient(160deg, #b8bbc1, #6e7176);
    border-radius: 999px;
    padding: 0;
    width: clamp(20px, 2.5vw, 36px); height: clamp(8px, 1vw, 12px);
    cursor: pointer; touch-action: none;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35);
    transition: transform 0.05s;
  }
  .gba-startsel .key:active { transform: scale(0.92); filter: brightness(0.8); }
  .gba-startsel .lbl {
    position: absolute; color: #d2d4d8;
    font-size: clamp(6px, 0.7vw, 9px); letter-spacing: 1px;
    font-family: 'Arial Black', sans-serif; font-style: italic;
  }
  .gba-startsel .lbl-start  { left: 0; top: -55%; }
  .gba-startsel .lbl-select { right: 0; top: -55%; }

  /* Speaker grille bottom-right (decorative) */
  .gba-speaker {
    position: absolute; bottom: 12%; right: 7%;
    width: 8%; height: 12%;
    background:
      repeating-linear-gradient(35deg, #0c0d0f 0 2px, #2a2c30 2px 4px);
    border-radius: 4px;
    opacity: 0.85;
  }

  /* Hint text below shell */
  #hint {
    font-size: clamp(7px, 0.9vw, 10px); color: #7d8da0;
    text-align: center; line-height: 1.7; letter-spacing: 0.5px;
    max-width: 720px;
  }
  #hint b { color: #a8c0e0; }
  @media (max-width: 640px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="gba">
  <div class="gba-nin">Nintendo</div>
  <div class="gba-power"><span class="dot"></span><span class="lbl">POWER</span></div>

  <div class="gba-dpad">
    <div class="key up"    data-k="ArrowUp"></div>
    <div class="key down"  data-k="ArrowDown"></div>
    <div class="key left"  data-k="ArrowLeft"></div>
    <div class="key right" data-k="ArrowRight"></div>
    <div class="key center"></div>
  </div>

  <div class="gba-screen">
    <canvas id="game" width="480" height="432"></canvas>
  </div>

  <div class="gba-ab">
    <div class="key b" data-k="KeyX">B</div>
    <div class="key a" data-k="KeyZ">A</div>
  </div>

  <div class="gba-startsel">
    <div class="lbl lbl-start">START</div>
    <div class="key" data-k="Enter"></div>
    <div class="key" data-k="ShiftLeft"></div>
    <div class="lbl lbl-select">SELECT</div>
  </div>

  <div class="gba-speaker"></div>
  <div class="gba-label">GAME BOY ADVANCE</div>
</div>
<div id="hint">
  Arrow keys / WASD = move &nbsp;•&nbsp; <b>Z</b> = A (talk / confirm) &nbsp;•&nbsp; <b>X</b> = B (cancel) &nbsp;•&nbsp; Enter = START / menu
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
